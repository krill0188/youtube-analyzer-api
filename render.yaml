services:
  - type: web
    name: youtube-analyzer-api
    env: python
    buildCommand: pip install fastapi uvicorn youtube-transcript-api yt-dlp pydantic python-dotenv
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEYS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
